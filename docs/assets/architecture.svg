<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="870" viewBox="0 0 1280 870" role="img" aria-labelledby="title desc">
<title id="title">Evidence 系统架构</title><desc id="desc">WebUI 通过 FastAPI，CLI 直接调用研究流程；LangGraph 管理主管、调查、确定性计算与独立核验，使用受限工具和方法技能；保存统一快照并按请求导出。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#65776f" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="870" rx="20" fill="#f5f7f5"/>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1e3029}.title{font-size:29px;font-weight:700}.h{font-size:21px;font-weight:700}.t{font-size:17px}.s{font-size:15px;fill:#54685f}.line{fill:none;stroke:#65776f;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="40" y="48" class="title">Evidence / 从问题到可复核交付</text>
<text x="40" y="78" class="s">模块化单体 · 模型负责调查与解释 · 程序负责计算与发布约束</text>
