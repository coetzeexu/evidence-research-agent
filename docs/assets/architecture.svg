<rect x="40" y="236" width="756" height="92" rx="12" fill="#ffffff" stroke="#cdd9d1"/>
<text x="62" y="271" class="h">FastAPI · 同源 API + SSE</text>
<text x="62" y="300" class="t">任务队列 / 会话接口 / 过程事件 / 文件下载</text>
