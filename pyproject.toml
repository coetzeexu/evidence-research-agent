[project]
name = "research-agent"
version = "0.1.0"
description = "Evidence-led market research with interactive reports"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "httpx[socks]>=0.28,<1", "pandas>=2.2,<4", "numpy>=2,<3",
  "exchange-calendars>=4.8,<5", "langchain>=1,<2", "langgraph>=1,<2",
  "langchain-openai>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "ddgs>=9,<10", "beautifulsoup4>=4.13,<5", "python-dotenv>=1,<2",
  "xlsxwriter>=3.2,<4", "python-docx>=1.1,<2", "python-pptx>=1,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "hypothesis>=6,<7", "ruff>=0.12,<1", "openpyxl>=3.1,<4"]

[project.scripts]
research = "research_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/research_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
